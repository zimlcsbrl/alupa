# Infra local de desenvolvimento. O Postgres fica no Neon.
services:
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: alupa
      MINIO_ROOT_PASSWORD: alupa-dev-secret
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data

  minio-setup:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 alupa alupa-dev-secret; do sleep 1; done;
      mc mb --ignore-existing local/alupa-dev;
      "

volumes:
  redis-data:
  minio-data:
